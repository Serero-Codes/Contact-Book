<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">A book of names &amp; numbers</p>
      <h1>Contact Book</h1>
      <p class="tagline">Keep every name and number close at hand.</p>
    </div>
  </header>

  <main class="container">

    <section class="card form-card" aria-labelledby="formTitle">
      <div class="card-tab" aria-hidden="true"></div>
      <div class="card-body">
        <h2 id="formTitle">New entry</h2>

        <form id="contactForm" novalidate>
          <input type="hidden" id="contactId" value="">

          <div class="field-row">
            <label class="field">
              <span>First name</span>
              <input type="text" id="firstName" autocomplete="given-name" required>
            </label>
            <label class="field">
              <span>Last name</span>
              <input type="text" id="lastName" autocomplete="family-name" required>
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              <span>Phone number</span>
              <input type="tel" id="phoneNumber" autocomplete="tel" required>
            </label>
            <label class="field">
              <span>Email <em>optional</em></span>
              <input type="email" id="email" autocomplete="email">
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitButton" class="btn btn-primary">Save contact</button>
            <button type="button" id="resetForm" class="btn btn-ghost">Clear form</button>
          </div>
        </form>

        <p id="formMessage" class="message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="card list-card" aria-labelledby="listTitle">
      <div class="list-header">
        <h2 id="listTitle">Your contacts</h2>
        <span id="contactsCount" class="count-pill"></span>
      </div>

      <div id="contactsLoading" class="loading-state">Loading your contacts…</div>

      <ul id="contactsTable" class="contacts-list"></ul>

      <div id="contactsEmpty" class="empty-state">
        <p class="empty-title">No contacts yet</p>
        <p class="empty-copy">Add your first entry above and it will show up here.</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>Contact Book — keep your circle close.</p>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
